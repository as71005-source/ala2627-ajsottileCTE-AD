<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignments | Alex J. Sottile</title>
  <meta name="description" content="A growing archive of Alex J. Sottile's assignments and experiments.">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(122, 215, 255, 0.18), transparent 25%),
        linear-gradient(135deg, #07151d 0%, #0b1f2d 42%, #112738 100%);
    }

    .assignment-stack {
      display: grid;
      gap: 28px;
      margin-top: 24px;
    }

    .runner-card {
      background: rgba(8, 16, 23, 0.8);
      border: 1px solid rgba(147, 241, 209, 0.18);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
    }

    .runner-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .runner-header h2 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .runner-header button {
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #93f1d1, #7ad7ff);
      color: #06151d;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 10px 18px;
      cursor: pointer;
    }

    .runner-hud {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #a2b7c1;
    }

    .runner-hud strong {
      color: #edf7ff;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
    }

    #gdCanvas {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      border: 2px solid rgba(147, 241, 209, 0.22);
      background: linear-gradient(180deg, #05161c 0%, #0d2230 62%, #08181d 100%);
      box-shadow: inset 0 0 16px rgba(122, 215, 255, 0.15);
    }

    .runner-status {
      margin: 12px 0 0;
      color: #dfeef6;
      font-weight: 600;
      min-height: 24px;
    }

    .runner-status.good {
      color: #93f1d1;
    }

    .runner-status.bad {
      color: #ff9ca8;
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="wordmark" href="../" aria-label="Alex Sottile home"><span
          class="wordmark-mark">A</span><span>ajsottile<span class="wordmark-dot">.</span></span></a>
      <a class="nav-cta" href="../">Back home <span aria-hidden="true">&#8598;</span></a>
    </header>
    <main class="assignment-stack">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy reveal">
          <p class="eyebrow"><span class="status-dot"></span> Work in progress</p>
          <h1 id="page-title">The next<br><em>chapter.</em></h1>
          <p class="hero-intro">This is where new assignments, experiments, and projects will land as I keep learning.
          </p>
        </div>
      </section>

      <section class="runner-card reveal" aria-label="Geometry Dash inspired game">
        <div class="runner-header">
          <h2>Wave Runner</h2>
          <button id="startRunner" type="button">Start</button>
        </div>

        <div class="runner-hud">
          <span>Score: <strong id="runnerScore">0</strong></span>
          <span>Best: <strong id="runnerBest">0</strong></span>
        </div>

        <canvas id="gdCanvas" width="900" height="260" aria-label="Runner game playfield"></canvas>
        <p id="runnerStatus" class="runner-status">Press Start to begin.</p>
      </section>
    </main>
    <footer class="site-footer"><span>Built by Alex J. Sottile</span><a href="../">Back to home <span
          aria-hidden="true">&#8599;</span></a></footer>
  </div>

  <script>
    const canvas = document.getElementById('gdCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('runnerScore');
    const bestEl = document.getElementById('runnerBest');
    const statusEl = document.getElementById('runnerStatus');
    const startButton = document.getElementById('startRunner');

    const bestKey = 'waveRunnerBest';
    let bestScore = Number(localStorage.getItem(bestKey)) || 0;
    bestEl.textContent = bestScore;

    const player = {
      x: 70,
      y: 170,
      width: 30,
      height: 30,
      vy: 0,
      grounded: true
    };

    let obstacles = [];
    let score = 0;
    let playing = false;
    let animationId = null;
    let spawnTimer = 0;
    let lastTime = 0;

    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = `runner-status ${type}`.trim();
    }

    function resetPlayer() {
      player.x = 70;
      player.y = 170;
      player.vy = 0;
      player.grounded = true;
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = score;
      obstacles = [];
      resetPlayer();
      playing = true;
      spawnTimer = 0;
      lastTime = 0;
      setStatus('Run!', 'good');
      if (animationId) cancelAnimationFrame(animationId);
      animationId = requestAnimationFrame(loop);
    }

    function endGame() {
      playing = false;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem(bestKey, String(bestScore));
        bestEl.textContent = bestScore;
      }
      setStatus('Crash! Press Start to try again.', 'bad');
      cancelAnimationFrame(animationId);
    }

    function jump() {
      if (!playing) return;
      if (player.grounded) {
        player.vy = -12;
        player.grounded = false;
      }
    }

    function spawnObstacle() {
      const typeRoll = Math.random();
      const width = typeRoll < 0.35 ? 26 : 34 + Math.random() * 30;
      const height = typeRoll < 0.35 ? 34 : 24 + Math.random() * 26;
      obstacles.push({
        x: canvas.width + 20,
        y: 210 - height,
        width,
        height,
        type: typeRoll < 0.35 ? 'spike' : 'block'
      });
    }

    function update(dt) {
      if (!playing) return;

      player.vy += 0.55;
      player.y += player.vy;

      const groundY = 210;
      if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.vy = 0;
        player.grounded = true;
      }

      score += dt * 0.02;
      scoreEl.textContent = Math.floor(score);

      spawnTimer += dt;
      if (spawnTimer > 1100) {
        spawnTimer = 0;
        spawnObstacle();
      }

      const speed = 6 + Math.min(score / 120, 5);
      for (let i = obstacles.length - 1; i >= 0; i -= 1) {
        const obstacle = obstacles[i];
        obstacle.x -= speed;

        const playerRect = {
          x: player.x,
          y: player.y,
          width: player.width,
          height: player.height
        };

        if (
          playerRect.x < obstacle.x + obstacle.width &&
          playerRect.x + playerRect.width > obstacle.x &&
          playerRect.y < obstacle.y + obstacle.height &&
          playerRect.y + playerRect.height > obstacle.y
        ) {
          endGame();
          return;
        }

        if (obstacle.x + obstacle.width < -20) {
          obstacles.splice(i, 1);
        }
      }
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#091b24');
      sky.addColorStop(0.55, '#112d3f');
      sky.addColorStop(1, '#07151d');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(122, 215, 255, 0.18)';
      for (let i = 0; i < 18; i += 1) {
        const x = (i * 62 + (score * 2) % 60) % (canvas.width + 70) - 30;
        const y = 18 + (i % 5) * 22;
        ctx.fillRect(x, y, 4, 4);
      }

      ctx.fillStyle = '#0d1b25';
      ctx.fillRect(0, 210, canvas.width, 50);

      ctx.strokeStyle = 'rgba(147, 241, 209, 0.24)';
      ctx.lineWidth = 2;
      for (let i = 0; i < canvas.width; i += 38) {
        ctx.beginPath();
        ctx.moveTo(i, 210);
        ctx.lineTo(i + 20, 260);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      ctx.fillStyle = '#93f1d1';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.fillStyle = '#0a1e29';
      ctx.fillRect(player.x + 7, player.y + 8, 5, 5);
      ctx.fillRect(player.x + 18, player.y + 8, 5, 5);

      ctx.fillStyle = '#7ad7ff';
      ctx.fillRect(player.x + 6, player.y + 22, player.width - 12, 4);
    }

    function drawObstacle(obstacle) {
      ctx.fillStyle = obstacle.type === 'spike' ? '#ff8a65' : '#ffb788';
      if (obstacle.type === 'spike') {
        ctx.beginPath();
        ctx.moveTo(obstacle.x, obstacle.y + obstacle.height);
        ctx.lineTo(obstacle.x + obstacle.width / 2, obstacle.y);
        ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
      }
    }

    function render() {
      drawBackground();
      obstacles.forEach(drawObstacle);
      drawPlayer();
    }

    function loop(timestamp) {
      if (!playing) return;
      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;
      update(delta);
      render();
      animationId = requestAnimationFrame(loop);
    }

    startButton.addEventListener('click', startGame);
    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space' || event.code === 'ArrowUp' || event.code === 'KeyW') {
        event.preventDefault();
        jump();
      }
    });
    canvas.addEventListener('pointerdown', jump);

    resetPlayer();
    render();
    setStatus('Press Start to begin.');
  </script>
</body>

</html>
