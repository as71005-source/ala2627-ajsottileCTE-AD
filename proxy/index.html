<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bing Proxy Browser</title>
  <meta name="description" content="Bing-powered proxy browser shell for GitHub Pages." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell">
    <header class="browser-bar">
      <div class="brand-block">
        <div class="brand-mark">D</div>
        <div class="brand-copy">
          <span class="brand-name">Bing</span>
          <span class="brand-subtitle">Private Proxy</span>
        </div>
      </div>

      <form id="proxyForm" class="address-bar" novalidate>
        <label class="sr-only" for="urlInput">Search or website URL</label>
        <input id="urlInput" type="text" value="https://www.bing.com/" autocomplete="off" spellcheck="false"
          aria-label="Search or website URL" />
        <button type="submit" class="primary-btn">Search</button>
        <button type="button" id="homeBtn" class="ghost-btn">Home</button>
      </form>
    </header>

    <div class="status-row">
      <div class="pill">Privacy mode</div>
      <div class="status-wrap">
        <span class="shield">🛡</span>
        <span id="statusText" class="status-text">Loading…</span>
      </div>
    </div>

    <div class="tool-row">
      <button id="previewBtn" type="button" class="secondary-btn">Preview in page</button>
      <button id="newTabBtn" type="button" class="secondary-btn">Open in new tab</button>
    </div>

    <div id="fallbackPanel" class="fallback-panel hidden" aria-live="polite">
      <h2>Site blocked from embedding</h2>
      <p>This website blocks iframe previewing, so it opened in a new tab instead.</p>
    </div>

    <main class="viewport-wrap">
      <div id="proxyFrame" class="proxy-content" aria-live="polite"></div>
    </main>

    <footer class="footer-note">
      This Bing proxy searches through a fetch-based result feed so the results render inside the browser shell.
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
