<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPACE INVADERS</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Classic arcade</p>
        <h1>SPACE INVADERS</h1>
      </div>
      <button id="start-btn" class="start-btn">Start game</button>
    </header>

    <section class="hud" aria-label="Game stats">
      <div class="hud-box">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud-box">
        <span>Lives</span>
        <strong id="lives">3</strong>
      </div>
      <div class="hud-box">
        <span>Time</span>
        <strong id="time">60</strong>
      </div>
      <div class="hud-box">
        <span>Level</span>
        <strong id="level">1</strong>
      </div>
    </section>

    <div id="game-board" class="game-board" aria-label="Space Invaders game area">
      <div id="player" class="player" aria-label="Player ship"></div>
    </div>

    <p id="message" class="message">Press Start to defend Earth.</p>
  </main>

  <script src="script.js"></script>
</body>

</html>
