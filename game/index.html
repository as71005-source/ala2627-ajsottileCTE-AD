<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Category | Ping Pong</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Arcade portal</p>
        <h1>Portal Category</h1>
      </div>
      <button id="start-btn" class="start-btn">Start game</button>
    </header>

    <section class="hud" aria-label="Game stats">
      <div class="hud-box">
        <span>Player</span>
        <strong id="player-score">0</strong>
      </div>
      <div class="hud-box">
        <span>CPU</span>
        <strong id="cpu-score">0</strong>
      </div>
      <div class="hud-box">
        <span>Round</span>
        <strong id="round">1</strong>
      </div>
      <div class="hud-box">
        <span>Status</span>
        <strong id="status">Ready</strong>
      </div>
    </section>

    <div class="game-wrap">
      <canvas id="game-board" width="900" height="520" aria-label="Portal Category ping pong game"></canvas>
    </div>

    <p id="message" class="message">Press Start to launch the match.</p>
  </main>

  <script src="script.js"></script>
</body>

</html>
